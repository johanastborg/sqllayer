[package]
name = "sqllayer"
version = "0.1.0"
edition = "2021"
description = "SQL layer on top of Redis using Morton codes (Z-order curves) for multidimensional indexing"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
redis = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlparser = "0.52"
thiserror = "2.0"
